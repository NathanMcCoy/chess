[package]
name = "trainer"
version = "0.1.0"
edition = "2024"
description = "Trains the site's hex bot by self-play, fast (the browser's bot is site/js/bot/bot.js)"
license = "GPL-3.0-or-later"
publish = false

# For reading and writing the weights files (JSON). This program runs only on a developer's PC and
# in CI: nothing here goes into the site or its image.
[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
